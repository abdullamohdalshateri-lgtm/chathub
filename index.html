
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101319">
<title>ChatHub</title>

<style>
:root {
  color-scheme: dark;
  --bg:#101319;
  --panel:#191f29;
  --surface:#222a36;
  --text:#f5f7fb;
  --muted:#929eaf;
  --accent:#719cff;
  --border:#303947;
}
:root[data-theme="light"] {
  color-scheme:light;
  --bg:#f5f6f8;
  --panel:#ffffff;
  --surface:#edf0f5;
  --text:#171b23;
  --muted:#727d8d;
  --accent:#386fe0;
  --border:#e0e4eb;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
button,input,select {font:inherit}
button {
  cursor:pointer;
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:var(--accent);
  color:white;
  font-weight:700;
}
button:disabled {opacity:.5;cursor:not-allowed}
input {
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  outline:none;
  margin:7px 0;
}
input:focus {border-color:var(--accent)}
.logo {
  font-family:"Montserrat",sans-serif;
  font-weight:700;
  letter-spacing:-1.5px;
}
.muted {color:var(--muted)}
.small {font-size:13px}
.hidden {display:none!important}
#authView {
  max-width:420px;
  margin:10vh auto;
  padding:25px;
}
.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}
.authLogo {font-size:35px;color:var(--accent)}
.full {width:100%;margin-top:10px}
.secondary {
  background:var(--surface);
  color:var(--text);
}
#appView {max-width:1000px;margin:auto;padding:20px}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0 20px;
}
header .logo {font-size:27px;color:var(--accent)}
.layout {
  display:grid;
  grid-template-columns:220px 1fr;
  gap:18px;
}
nav {display:flex;flex-direction:column;gap:8px}
nav button {
  background:transparent;
  color:var(--muted);
  text-align:left;
}
nav button.active {
  background:var(--surface);
  color:var(--text);
}
.content {min-height:550px}
.sectionTitle {font-size:21px;margin:0 0 8px}
.item {
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 5px;
  border-bottom:1px solid var(--border);
}
.avatar {
  width:42px;height:42px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:50%;
  background:var(--surface);
  color:var(--accent);
  font-weight:bold;
}
.itemInfo {flex:1;min-width:0}
.itemInfo strong {display:block}
.itemInfo small {color:var(--muted)}
.item button {padding:9px 12px}
.searchRow {display:flex;gap:8px}
.searchRow input {flex:1;min-width:0}
#messages {
  height:360px;
  overflow-y:auto;
  padding:12px;
  background:var(--bg);
  border-radius:12px;
  margin:15px 0;
}
.bubble {
  max-width:80%;
  width:fit-content;
  padding:11px 14px;
  border-radius:13px;
  background:var(--surface);
  margin:9px 0;
  overflow-wrap:anywhere;
}
.bubble.mine {
  margin-left:auto;
  background:var(--accent);
  color:white;
}
#messageForm {display:flex;gap:8px}
#messageForm input {flex:1;min-width:0}
#messageForm button {margin-top:7px}
.settingRow {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}
select {
  padding:10px;
  border-radius:9px;
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--border);
}
#status,#profileStatus,#messageStatus {
  color:var(--muted);
  font-size:13px;
  min-height:20px;
  overflow-wrap:anywhere;
}
@media(max-width:650px) {
  #appView {padding:15px}
  .layout {grid-template-columns:1fr}
  nav {
    flex-direction:row;
    overflow-x:auto;
  }
  nav button {white-space:nowrap;text-align:center}
  .content {min-height:400px}
}
</style>
</head>

<body>

<div id="authView">
  <div class="logo authLogo">CHATHUB</div>
  <p class="muted">Your conversations, all in one place.</p>

  <div class="panel">
    <h2 id="authHeading">Welcome back</h2>

    <div id="usernameField" class="hidden">
      <input id="username" placeholder="Choose a username">
    </div>

    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">

    <button class="full" id="authButton">Log in</button>
    <button class="full secondary" id="switchAuth">Create an account</button>
    <p id="status"></p>
  </div>
</div>

<div id="profileSetup" class="hidden">
  <div class="panel" style="max-width:420px;margin:10vh auto">
    <h2>Set up your profile</h2>
    <p class="muted">Choose your ChatHub username.</p>
    <input id="setupUsername" placeholder="Username">
    <button class="full" id="saveProfile">Continue</button>
    <p id="profileStatus"></p>
  </div>
</div>

<div id="appView" class="hidden">
  <header>
    <div class="logo">CHATHUB</div>
    <span class="muted small" id="currentUsername"></span>
  </header>

  <div class="layout">
    <nav>
      <button class="active" data-page="contacts">Contacts</button>
      <button data-page="search">Find users</button>
      <button data-page="chats">Messages</button>
      <button data-page="settings">Settings</button>
    </nav>

    <main class="content panel">

      <section id="contactsPage">
        <h2 class="sectionTitle">Contacts</h2>
        <p class="muted small">People you've added on ChatHub.</p>
        <div id="contactsList"></div>
      </section>

      <section id="searchPage" class="hidden">
        <h2 class="sectionTitle">Find people</h2>
        <p class="muted small">Search using a username or email.</p>
        <div class="searchRow">
          <input id="userSearch" placeholder="Username or email">
          <button id="searchButton">Search</button>
        </div>
        <div id="searchResults"></div>
      </section>

      <section id="chatsPage" class="hidden">
        <h2 class="sectionTitle">Messages</h2>
        <div id="chatList"></div>
      </section>

      <section id="settingsPage" class="hidden">
        <h2 class="sectionTitle">Settings</h2>

        <div class="settingRow">
          <div>
            <strong>Appearance</strong>
            <div class="muted small">Choose your preferred theme.</div>
          </div>
          <select id="themeSelect">
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>

        <div class="settingRow">
          <div>
            <strong>Account</strong>
            <div class="muted small" id="settingsEmail"></div>
          </div>
        </div>

        <button id="logoutButton" class="secondary full">Log out</button>
      </section>

      <section id="conversationPage" class="hidden">
        <button class="secondary" id="backButton">← Back</button>
        <h2 id="conversationTitle"></h2>
        <div id="messages"></div>
        <form id="messageForm">
          <input id="messageInput" placeholder="Write a message..." maxlength="5000">
          <button type="submit">Send</button>
        </form>
        <p id="messageStatus" class="muted small"></p>
      </section>

    </main>
  </div>
</div>

<script type="module">
import {initializeApp} from
 "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
 getAuth,onAuthStateChanged,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signOut
} from
 "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
 getFirestore,collection,doc,setDoc,getDoc,getDocs,
 query,where,onSnapshot,addDoc,serverTimestamp,orderBy
} from
 "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCfY261bu8-qzxV6WGTqp8PqKu0D-i406Y",
 authDomain: "chathub-75a47.firebaseapp.com",
 projectId: "chathub-75a47",
 storageBucket: "chathub-75a47.firebasestorage.app",
 messagingSenderId: "663781705692",
 appId: "1:663781705692:web:78fb223c742db8d397b119"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

let currentUser=null;
let currentProfile=null;
let currentChat=null;
let isRegister=false;
let stopContacts=null;
let stopChats=null;
let stopMessages=null;

function status(message) {
 $("status").textContent=message;
}

function showError(element,error,stage) {
 console.error(stage,error);
 element.textContent=
  stage+" — "+(error.code||"Error")+": "+error.message;
}

function applyTheme() {
 const saved=localStorage.getItem("chathub-theme")||"system";
 const systemDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
 const theme=saved==="system"?(systemDark?"dark":"light"):saved;
 document.documentElement.dataset.theme=theme;
 if($("themeSelect")) $("themeSelect").value=saved;
}

applyTheme();

$("themeSelect").addEventListener("change",e=>{
 localStorage.setItem("chathub-theme",e.target.value);
 applyTheme();
});

window.matchMedia("(prefers-color-scheme: dark)")
 .addEventListener("change",()=>{
  if((localStorage.getItem("chathub-theme")||"system")==="system")
   applyTheme();
 });

function showPage(name) {
 ["contacts","search","chats","settings","conversation"]
 .forEach(page=>{
  $(`${page}Page`).classList.toggle("hidden",page!==name);
 });

 document.querySelectorAll("nav button").forEach(button=>{
  button.classList.toggle("active",button.dataset.page===name);
 });
}

document.querySelectorAll("nav button").forEach(button=>{
 button.addEventListener("click",()=>showPage(button.dataset.page));
});

function makeItem(name,detail,buttonText,action) {
 const item=document.createElement("div");
 item.className="item";

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=(name||"?").charAt(0).toUpperCase();

 const info=document.createElement("div");
 info.className="itemInfo";

 const strong=document.createElement("strong");
 strong.textContent=name;

 const small=document.createElement("small");
 small.textContent=detail||"";

 info.append(strong,small);
 item.append(avatar,info);

 if(buttonText) {
  const button=document.createElement("button");
  button.textContent=buttonText;
  button.addEventListener("click",action);
  item.append(button);
 }

 return item;
}

function stopListeners() {
 [stopContacts,stopChats,stopMessages].forEach(stop=>{
  if(stop)stop();
 });
 stopContacts=stopChats=stopMessages=null;
}

async function createProfile(username) {
 username=username.trim().replace(/^@/,"");

 if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
  throw new Error("Use 3–20 letters, numbers or underscores.");
 }

 const usernameLower=username.toLowerCase();

 const existing=await getDocs(query(
  collection(db,"profiles"),
  where("usernameLower","==",usernameLower)
 ));

 if(!existing.empty) {
  throw new Error("That username is already taken.");
 }

 await setDoc(doc(db,"profiles",currentUser.uid),{
  uid:currentUser.uid,
  username,
  usernameLower,
  email:currentUser.email,
  createdAt:serverTimestamp()
 });

 currentProfile={
  uid:currentUser.uid,
  username,
  email:currentUser.email
 };

 showApp();
}

async function showApp() {
 $("authView").classList.add("hidden");
 $("profileSetup").classList.add("hidden");
 $("appView").classList.remove("hidden");

 $("currentUsername").textContent="@"+currentProfile.username;
 $("settingsEmail").textContent=currentUser.email;

 startContacts();
 startChats();
 showPage("contacts");
}

onAuthStateChanged(auth,async user=>{
 stopListeners();
 currentUser=user;
 currentProfile=null;

 if(!user) {
  $("appView").classList.add("hidden");
  $("profileSetup").classList.add("hidden");
  $("authView").classList.remove("hidden");
  return;
 }

 try {
  const profile=await getDoc(doc(db,"profiles",user.uid));

  if(profile.exists()) {
   currentProfile=profile.data();
   showApp();
  } else {
   $("authView").classList.add("hidden");
   $("appView").classList.add("hidden");
   $("profileSetup").classList.remove("hidden");
  }
 } catch(error) {
  showError($("profileStatus"),error,"Loading profile");
 }
});

$("switchAuth").addEventListener("click",()=>{
 isRegister=!isRegister;
 $("authHeading").textContent=isRegister?"Create your account":"Welcome back";
 $("authButton").textContent=isRegister?"Create account":"Log in";
 $("switchAuth").textContent=isRegister?"Back to login":"Create an account";
 $("usernameField").classList.toggle("hidden",!isRegister);
 status("");
});

$("authButton").addEventListener("click",async()=>{
 const email=$("email").value.trim().toLowerCase();
 const password=$("password").value;

 status("Please wait...");

 try {
  if(isRegister) {
   if(!$("username").value.trim()) {
    throw new Error("Choose a username first.");
   }

   const result=await createUserWithEmailAndPassword(auth,email,password);
   currentUser=result.user;
   await createProfile($("username").value);
  } else {
   await signInWithEmailAndPassword(auth,email,password);
  }
 } catch(error) {
  status(error.code ? error.code+": "+error.message : error.message);
 }
});

$("saveProfile").addEventListener("click",async()=>{
 try {
  $("profileStatus").textContent="Saving...";
  await createProfile($("setupUsername").value);
 } catch(error) {
  showError($("profileStatus"),error,"Saving profile");
 }
});

async function searchUsers() {
 const term=$("userSearch").value.trim().replace(/^@/,"");
 const results=$("searchResults");
 results.replaceChildren();

 if(term.length<2) {
  results.textContent="Enter at least two characters.";
  return;
 }

 try {
  const [byUsername,byEmail]=await Promise.all([
   getDocs(query(collection(db,"profiles"),
    where("usernameLower","==",term.toLowerCase()))),
   getDocs(query(collection(db,"profiles"),
    where("email","==",term.toLowerCase())))
  ]);

  const found=new Map();

  [...byUsername.docs,...byEmail.docs].forEach(d=>{
   found.set(d.id,d.data());
  });

  found.delete(currentUser.uid);

  if(found.size===0) {
   results.textContent="No registered users found.";
   return;
  }

  for(const person of found.values()) {
   const contact=await getDoc(
    doc(db,"users",currentUser.uid,"contacts",person.uid)
   );

   results.append(makeItem(
    person.username,
    person.email,
    contact.exists()?"Added":"Add",
    async()=>{
     if(contact.exists())return;

     try {
      await setDoc(
       doc(db,"users",currentUser.uid,"contacts",person.uid),
       {
        uid:person.uid,
        username:person.username,
        email:person.email,
        createdAt:serverTimestamp()
       }
      );

      searchUsers();
     } catch(error) {
      results.textContent=
       "Adding contact failed: "+(error.code||"Error")+" — "+error.message;
     }
    }
   ));
  }
 } catch(error) {
  results.textContent=
   "Search failed: "+(error.code||"Error")+" — "+error.message;
 }
}

$("searchButton").addEventListener("click",searchUsers);

$("userSearch").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchUsers();
});

function startContacts() {
 stopContacts=onSnapshot(
  collection(db,"users",currentUser.uid,"contacts"),
  snapshot=>{
   const list=$("contactsList");
   list.replaceChildren();

   if(snapshot.empty) {
    list.textContent="No contacts yet. Find someone to get started.";
    return;
   }

   snapshot.forEach(contact=>{
    const person=contact.data();

    list.append(makeItem(
     person.username,
     person.email,
     "Message",
     ()=>openChat(person)
    ));
   });
  },
  error=>{
   showError($("contactsList"),error,"Loading contacts");
  }
 );
}

function startChats() {
 stopChats=onSnapshot(
  query(
   collection(db,"chats"),
   where("members","array-contains",currentUser.uid)
  ),
  snapshot=>{
   const list=$("chatList");
   list.replaceChildren();

   if(snapshot.empty) {
    list.textContent="No conversations yet. Add a contact to start chatting.";
    return;
   }

   snapshot.forEach(chatDoc=>{
    const chat=chatDoc.data();
    const otherId=chat.members.find(id=>id!==currentUser.uid);

    getDoc(doc(db,"profiles",otherId)).then(profile=>{
     if(!profile.exists())return;

     list.append(makeItem(
      profile.data().username,
      chat.lastMessage||"Start a conversation",
      "Open",
      ()=>openChat(profile.data())
     ));
    }).catch(error=>{
     showError(list,error,"Loading chat profile");
    });
   });
  },
  error=>{
   showError($("chatList"),error,"Loading conversations");
  }
 );
}

async function openChat(person) {
 const messageStatus=$("messageStatus");
 messageStatus.textContent="Opening conversation...";

 $("conversationTitle").textContent=person.username;
 $("messages").replaceChildren();
 showPage("conversation");

 try {
  if(!person.uid) {
   throw new Error("This contact is missing its user ID.");
  }

  const members=[currentUser.uid,person.uid].sort();
  const chatId=members.join("_");
  const chatRef=doc(db,"chats",chatId);

  messageStatus.textContent="Checking conversation...";

  const existing=await getDoc(chatRef);

  if(!existing.exists()) {
   messageStatus.textContent="Creating conversation...";

   await setDoc(chatRef,{
    members,
    createdBy:currentUser.uid,
    createdAt:serverTimestamp()
   });
  }

  currentChat=chatId;
  messageStatus.textContent="";

  if(stopMessages)stopMessages();

  stopMessages=onSnapshot(
   query(
    collection(db,"chats",chatId,"messages"),
    orderBy("createdAt","asc")
   ),
   snapshot=>{
    const box=$("messages");
    box.replaceChildren();

    snapshot.forEach(messageDoc=>{
     const message=messageDoc.data();
     const bubble=document.createElement("div");

     bubble.className="bubble"+
      (message.senderId===currentUser.uid?" mine":"");

     bubble.textContent=message.text;
     box.append(bubble);
    });

    box.scrollTop=box.scrollHeight;
   },
   error=>{
    showError(messageStatus,error,"Loading messages");
   }
  );

 } catch(error) {
  currentChat=null;
  showError(messageStatus,error,"Opening conversation");
 }
}

$("messageForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const text=$("messageInput").value.trim();

 if(!text||!currentChat)return;

 const sendButton=$("messageForm").querySelector("button");
 sendButton.disabled=true;
 $("messageStatus").textContent="Sending...";

 try {
  await addDoc(
   collection(db,"chats",currentChat,"messages"),
   {
    senderId:currentUser.uid,
    text,
    createdAt:serverTimestamp()
   }
  );

  await setDoc(
   doc(db,"chats",currentChat),
   {
    lastMessage:text,
    lastMessageAt:serverTimestamp()
   },
   {merge:true}
  );

  $("messageInput").value="";
  $("messageStatus").textContent="";

 } catch(error) {
  showError($("messageStatus"),error,"Sending message");
 } finally {
  sendButton.disabled=false;
 }
});

$("backButton").addEventListener("click",()=>{
 if(stopMessages)stopMessages();
 stopMessages=null;
 currentChat=null;
 $("messageStatus").textContent="";
 showPage("chats");
});

$("logoutButton").addEventListener("click",async()=>{
 try {
  await signOut(auth);
 } catch(error) {
  status(error.message);
 }
});
</script>
</body>
</html>
